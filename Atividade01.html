<!DOCTYPE html>
<html lang="pt/br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade01</title>
    <link rel="stylesheet" href="Atividade01.style.css">
</head>
<body>
    <form id="formulario">
        <label for="nome">Nome completo:</label>
        <input id="nome" type="text" name="edtNome" />

        <label for="email">Email:</label>
        <input id="email"  type="email" name="edtEmail" />

        <label for="senha">Senha:</label>
        <input id="senha"  type="password" name="edtSenha" />

        <label for="idade">Idade:</label>
        <input id="idade"  type="number" name="edtIdade" />

        <label for="nascimento">Data de Nascimento:</label>
        <input id="nascimento"  type="date" name="edtNascimento" />

        <label>Gênero:</label>
        <label>Feminino<input id="fem" name="genero" type="radio"/></label>
        <label>Masculino<input id="masc" name="genero" type="radio"/></label>
        <label>Prefiro não dizer<input id="outros" name="genero" type="radio"/></label>

        <label>Turno Disponiveis:</label>
        <label>Matutino  <input    type="checkbox"/></label>
        <label>Vespertino<input    type="checkbox"/></label>
        <label>Noturno   <input    type="checkbox"/></label>

        <label for="cor"> Cor destaque:</label>
        <input id="cor"  type="color" name="cor" />
        <br>
        <button>Enviar</button>
        <script src="Atividade01.html.js"></script>

    </form>
</body>
</html>
